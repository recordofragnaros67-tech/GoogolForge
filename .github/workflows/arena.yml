name: arena
# Runs the Benchmark Arena with REAL AI models on GitHub's free servers.
# Start it from the Actions tab: arena > Run workflow.
on:
  workflow_dispatch:
    inputs:
      style:
        description: "genius, elite, team or plain"
        default: "genius"
      set:
        description: "hard, quick, full, or heplus (40 HumanEval+ tasks)"
        default: "hard"
      coder:
        description: "fast coder model"
        default: "qwen2.5-coder:1.5b"
      strong:
        description: "strong model the Smart Router escalates to (try qwen2.5-coder:7b)"
        default: "qwen2.5-coder:3b"
      runner:
        description: "ubuntu-latest (x64) or ubuntu-24.04-arm (ARM64, like the Pixel 8's chip family)"
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
permissions:
  contents: write
jobs:
  bench:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      GF_HOME: ${{ github.workspace }}/gfhome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ollama and models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -s http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "${{ inputs.coder }}"
          ollama pull "${{ inputs.strong }}"
          ollama pull llama3.2:1b
          mkdir -p "$GF_HOME"
          printf '{"coder":"%s","judge":"llama3.2:1b","strong":"%s","threads":4}' "${{ inputs.coder }}" "${{ inputs.strong }}" > "$GF_HOME/config.json"
      - name: Run the Arena
        run: |
          FLAGS="--${{ inputs.style }}"
          case "${{ inputs.set }}" in hard) FLAGS="$FLAGS --hard";; quick) FLAGS="$FLAGS --quick";; heplus) FLAGS="$FLAGS --heplus";; esac
          python -B src/bench.py $FLAGS | tee arena.txt
          python -B src/bench.py losses | tee losses.txt
          { echo '### Wrong answers (for diagnosis)'; echo '```'; cat losses.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat arena.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish scores to the website
        run: |
          python - <<'PY'
          import json, os, pathlib
          h = json.loads(pathlib.Path(os.environ["GF_HOME"], "bench_history.json").read_text())[-1]
          import platform
          h["machine"] = "GitHub Actions (${{ inputs.runner }}, " + platform.machine() + " CPU)"
          h["model"] = h["model"] + " + " + "${{ inputs.strong }}"
          keep = ("date","model","style","hard","quick","suite","tasks","solved","first_try","score","seconds","machine")
          pathlib.Path("entry.json").write_text(json.dumps({k: h.get(k, "arena" if k == "suite" else None) for k in keep}))
          PY
          git config user.name "gf-arena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry loop: other arena runs may publish at the same time.
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python - <<'PY'
          import json, pathlib
          p = pathlib.Path("docs/scores.json")
          allr = json.loads(p.read_text()) if p.exists() else []
          allr.append(json.loads(pathlib.Path("entry.json").read_text()))
          p.write_text(json.dumps(allr[-50:], indent=2))
          PY
            git add docs/scores.json
            git commit -q -m "Arena score: ${{ inputs.style }} ${{ inputs.set }}" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-results-${{ inputs.runner }}
          path: |
            arena.txt
            losses.txt
            ollama.log
            gfhome/bench_history.json
