name: selftest
on: [push, pull_request, workflow_dispatch]
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile src/*.py && bash -n googolforge_setup.sh
      - name: Self-tests
        run: |
          cd src
          for f in academy assistant bench forge13 forge3 path repairmem templates web; do
            echo "== $f"; HOME=$(mktemp -d) python -B $f.py selftest
          done
